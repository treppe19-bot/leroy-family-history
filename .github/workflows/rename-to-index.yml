name: Rename page to index.html

on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename HTML file to index.html
        run: |
          if [ -f illustrated-family-history-summary.html ] && [ ! -f index.html ]; then
            git config user.name "treppe19-bot"
            git config user.email "treppe19-bot@users.noreply.github.com"
            git mv illustrated-family-history-summary.html index.html
            git commit -m "Rename illustrated-family-history-summary.html to index.html"
            git push
          else
            echo "Nothing to rename."
          fi
